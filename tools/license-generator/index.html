<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>外贸助手授权码生成器</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;font-family:"Microsoft YaHei",Segoe UI,sans-serif;color:#17324d}.top{background:linear-gradient(120deg,#0e3d66,#11679d);color:#fff;padding:24px 32px}.top h1{margin:0 0 7px;font-size:26px}.top p{margin:0;color:#d7ebf8}.wrap{padding:24px 32px;display:grid;grid-template-columns:minmax(420px,1fr) minmax(360px,.9fr);gap:20px}.panel{background:#fff;border:1px solid #d7e1eb;border-radius:14px;padding:22px;box-shadow:0 8px 24px rgba(20,52,82,.07)}h2{margin:0 0 18px;font-size:18px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #bed0e0;border-radius:8px;padding:10px 12px;font:14px inherit}textarea.code{font:12px Consolas,monospace;min-height:150px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:#105f96;color:#fff;width:100%}.secondary{background:#e7f0f8;color:#174e78}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{padding:10px 12px;border-radius:8px;background:#eef7f1;color:#176b3a;margin-bottom:16px;font-size:13px}.status.bad{background:#fff0ef;color:#b42318}.records{max-height:480px;overflow:auto}.record{padding:12px 0;border-bottom:1px solid #e8eef4}.record b{display:block}.muted{font-size:12px;color:#718397;margin-top:4px}.empty{color:#8292a3;text-align:center;padding:40px 0}@media(max-width:850px){.wrap{grid-template-columns:1fr}}
</style></head><body><header class="top"><h1>外贸助手授权码生成器</h1><p>仅供销售方本机使用 · 离线签发 · 私钥不会发送到客户软件</p></header><main class="wrap"><section class="panel"><h2>签发新授权</h2><div id="keyStatus" class="status">正在检查私钥…</div><div class="field"><label>客户姓名或订单编号</label><input id="customer" placeholder="例如：Henry / ORDER-20261024-001"></div><div class="field"><label>客户电脑机器码</label><input id="machineId" placeholder="FTA-XXXX-XXXX-XXXX-XXXX"></div><div class="grid"><div class="field"><label>授权类型</label><select id="type"><option value="permanent">永久授权</option><option value="term">限时授权</option></select></div><div class="field"><label>到期日期</label><input id="expiresAt" type="date" disabled></div></div><div class="field"><label>最高支持版本（留空表示不限）</label><input id="maxVersion" placeholder="例如：1.5.0"></div><div class="field"><label>内部备注</label><textarea id="notes" rows="2" placeholder="该内容会写入授权信息，请勿填写敏感资料"></textarea></div><button id="generate" class="btn primary">生成授权码</button><div class="field" style="margin-top:16px"><label>生成结果</label><textarea id="code" class="code" readonly placeholder="授权码将在这里显示"></textarea></div><div class="actions"><button id="copy" class="btn secondary">复制授权码</button><button id="openData" class="btn secondary">打开本地数据目录</button><button id="backup" class="btn secondary">备份授权记录</button></div><div id="message" class="muted"></div></section><section class="panel"><h2>最近签发记录</h2><div id="records" class="records"></div></section></main><script>
const $=id=>document.getElementById(id);let state;
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderRecords(records){$('records').innerHTML=records.length?records.map(r=>`<div class="record"><b>${esc(r.customer)}</b><div>${esc(r.machineId)}</div><div class="muted">${esc(r.licenseId)} · ${r.type==='term'?`有效至 ${esc(r.expiresAt)}`:'永久授权'} · ${esc((r.issuedAt||'').slice(0,19).replace('T',' '))}</div></div>`).join(''):'<div class="empty">暂时没有授权记录</div>';}
async function refresh(){state=await window.licenseGenerator.status();const checked=(state.checkedPaths||[state.keyPath]).filter(Boolean).join('；');$('keyStatus').textContent=state.keyReady?`私钥已就绪，可以离线签发授权码。`:`私钥不可用：${state.keyError||'未知原因'}。已检查：${checked}`;$('keyStatus').className=`status${state.keyReady?'':' bad'}`;$('generate').disabled=!state.keyReady;renderRecords(state.records||[]);}
$('type').onchange=()=>{$('expiresAt').disabled=$('type').value!=='term';};
$('generate').onclick=async()=>{try{const result=await window.licenseGenerator.generate({customer:$('customer').value,machineId:$('machineId').value,type:$('type').value,expiresAt:$('expiresAt').value,maxVersion:$('maxVersion').value,notes:$('notes').value});$('code').value=result.activationCode;$('message').textContent=`已签发：${result.payload.licenseId}`;await refresh();}catch(error){$('message').textContent=`生成失败：${error.message}`;}};
$('copy').onclick=async()=>{if(!$('code').value)return;$('message').textContent='授权码已复制。';await window.licenseGenerator.copy($('code').value);};$('openData').onclick=()=>window.licenseGenerator.openData();$('backup').onclick=async()=>{const file=await window.licenseGenerator.backup();if(file)$('message').textContent=`已备份到：${file}`;};window.addEventListener('focus',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});refresh();
</script></body></html>
