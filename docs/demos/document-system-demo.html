  function parseCSV(text){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++;}else quote=!quote;}else if(!quote&&(c===','||c==='\t')){row.push(cell.trim());cell='';}else if(!quote&&(c==='\n'||c==='\r')){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell='';}else cell+=c;}if(cell||row.length){row.push(cell.trim());if(row.some(Boolean))rows.push(row);}return rows;}

    if(action==='background-clear'){delete appearance().background;toast('已清除演示背景');return;}
  }
  root.addEventListener('click',e=>{lastActionY=e.target.getBoundingClientRect().top-root.getBoundingClientRect().top;const b=e.target.closest('button');if(!b)return;if(b.dataset.mdAction!=null&&dataModule.handleClick(b)){e.stopImmediatePropagation();return;}if(b.dataset.msAction!=null&&settingsModule.handleClick(b)){e.stopImmediatePropagation();return;}if(b.dataset.page){page=b.dataset.page;if(page==='documents')mode='fill';draw();e.stopImmediatePropagation();return;}if(b.dataset.app){handleApp(b.dataset.app,b);if(b.dataset.app==='pi-terms'&&root.querySelector('[data-pi-copy]'))root.querySelector('[data-pi-copy]').value=window.FTADemoPITerms;persist();e.stopImmediatePropagation();return;}if(b.dataset.document){page='documents';mode='fill';}if(b.dataset.kind){filterType=b.dataset.kind;fieldKey='itemType';draw();e.stopImmediatePropagation();return;}if(b.dataset.fieldToggle){const f=settingFields().find(f=>f.k===b.dataset.fieldToggle);f.visible=!f.visible;draw();e.stopImmediatePropagation();return;}if(b.dataset.output){doc().output[b.dataset.output]=!doc().output[b.dataset.output];draw();e.stopImmediatePropagation();return;}if(b.hasAttribute('data-library')){handleApp('library',b);e.stopImmediatePropagation();return;}},true);
  function moduleInput(e){const n=e.target;if(n.dataset.mdField!=null&&dataModule.handleInput(n)){e.stopImmediatePropagation();return;}if(n.dataset.msField!=null&&settingsModule.handleInput(n)){e.stopImmediatePropagation();return;}if(n.dataset.appearance){appearance()[n.dataset.appearance]=n.value;if(n.dataset.appearance==='language')doc().values.language=n.value;refreshPreview();return;}if(n.dataset.advanced){advancedDraft[n.dataset.advanced]=n.type==='checkbox'?n.checked:n.value;if(n.dataset.advanced==='wide')advancedDraft.wide=n.value==='true';return;}if(n.dataset.optionProp){optionDraft[n.dataset.optionProp]=n.value;return;}if(n.hasAttribute('data-icon-search')){root.querySelector('[data-icon-list]').innerHTML=iconChoices(n.value);if(globalThis.lucide)lucide.createIcons();return;}if(n.hasAttribute('data-images')){doc().output.images=n.checked;refreshPreview();return;}if(n.hasAttribute('data-fit')){root.querySelector('.ft-preview-body').style.setProperty('--ft-preview-zoom',n.value==='100%'?1:root.querySelector('.ft-preview-body').clientWidth/794);return;}if(n.dataset.outputSelection){if(n.checked)outputSelection.add(n.dataset.outputSelection);else outputSelection.delete(n.dataset.outputSelection);return;}if(n.hasAttribute('data-all-output')){outputSelection=n.checked?new Set(Object.keys(docs)):new Set();outputWorkspace();return;}if(n.hasAttribute('data-history-search')){root.querySelector('[data-history-body]').innerHTML=recordRows(n.value);return;}if(n.hasAttribute('data-calc-input')){const vals={};root.querySelectorAll('[data-calc-input]').forEach(n=>vals[n.dataset.calcInput]=Number(n.value));const v=vals.length*vals.width*vals.height*vals.count;root.querySelector('[data-freight-result]').textContent='体积 '+v.toFixed(3)+' m³ · 费用 '+(v*vals.rate).toFixed(2);return;}if(n.type==='file'&&(n.dataset.field==='image'||n.hasAttribute('data-background'))){const file=n.files?.[0];if(file){const reader=new FileReader();reader.onload=()=>{if(n.hasAttribute('data-background'))appearance().background=reader.result;else doc().rows[Number(n.dataset.index)].imageData=reader.result;refreshPreview();};reader.readAsDataURL(file);}return;}}
  root.addEventListener('input',moduleInput,true);root.addEventListener('change',moduleInput,true);
  root.addEventListener('dragstart',e=>{const row=e.target.closest('[data-sort-key]');if(row){dragField=row.dataset.sortKey;e.dataTransfer.setData('text/plain',dragField);}});
  root.addEventListener('dragover',e=>{if(!dragField)return;const target=e.target.closest('[data-sort-key]');if(target){e.preventDefault();root.querySelectorAll('.is-dragover').forEach(n=>n.classList.remove('is-dragover'));target.classList.add('is-dragover');}});
  root.addEventListener('drop',e=>{if(!dragField)return;e.preventDefault();const target=e.target.closest('[data-sort-key]'),fields=settingFields(),i=fields.findIndex(f=>f.k===dragField),j=fields.findIndex(f=>f.k===target?.dataset.sortKey);if(i>=0&&j>=0&&!pinned(fields[i])&&!pinned(fields[j])&&fields[i].parent===fields[j].parent){fields.splice(j,0,fields.splice(i,1)[0]);}dragField='';draw();});
  root.addEventListener('dragend',()=>{dragField='';root.querySelectorAll('.is-dragover').forEach(n=>n.classList.remove('is-dragover'));});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'&&root.querySelector('[data-modal]'))closeModal();});
  new ResizeObserver(fitPreview).observe(root);

  draw();
})();
</script>
