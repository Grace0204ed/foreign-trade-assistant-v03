name: Build and publish Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expected = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          if ("${{ github.ref_name }}" -ne $expected) { throw "Tag ${{ github.ref_name }} does not match package version $expected" }
      - run: npm run ensure:sqlite
      - run: npm run check
      - run: npm test
      - name: Verify configured customer workflow in Electron
        run: npm run test:customers
      - name: Verify approved layout and history pagination in Electron
        run: npm run test:approved
      - name: Verify header, CRM and application lock interactions
        run: npm run test:next
      - name: Verify product edits, imports and seven document workspaces
        run: npm run test:refinement
      - name: Verify product edit modal and procurement navigation
        run: npm run test:product-modal
      - name: Verify real PDF exports and column alignment
        run: npm run test:pdf
      - name: Verify seven document field persistence and PDF output
        run: npm run test:fields
      - name: Build installer without concurrent release creation
        run: npm run rebuild:electron && npx electron-builder --win nsis --publish never
      - name: Publish one complete release atomically
        run: node scripts/publish-release.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

