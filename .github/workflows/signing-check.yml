name: Check Windows document rendering

on:
  workflow_dispatch:
    inputs:
      check:
        description: Document workflow to verify
        type: choice
        default: signing
        options:
          - signing
          - readability
          - recovery

permissions:
  contents: read

jobs:
  signing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run rebuild:electron
      - name: Verify real handwriting, saved signatures and historical PDF snapshots
        if: inputs.check == 'signing'
        run: npx electron scripts/test-signing-workflow.cjs
      - name: Verify readable screen and print layouts and actual multi-page PDFs
        if: inputs.check == 'readability'
        run: npm run test:readability
      - name: Verify isolated draft recovery across real process restarts
        if: inputs.check == 'recovery'
        shell: pwsh
        run: |
          1..8 | ForEach-Object {
            npm run test:recovery
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
