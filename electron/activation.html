<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>激活外贸助手</title><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'"><link rel="stylesheet" href="activation.css"></head>
<body><main class="card"><div class="brand"><img src="../assets/app-icon.png" alt="">外贸助手</div><div class="heading"><span class="badge">待授权</span><h1 class="title">欢迎使用外贸助手</h1><p class="sub">完成本机授权后，即可开始使用。</p></div><div class="label">本机机器码</div><div class="machine"><div id="machine" class="code">正在读取…</div><button id="copy" class="btn secondary" type="button">复制机器码</button></div><p class="help">请将机器码发送给我们，用于签发本机授权。</p><label class="label" for="activation">授权码</label><textarea id="activation" rows="4" placeholder="请粘贴收到的完整授权码"></textarea><div id="status" class="status" role="status" aria-live="polite"></div><button id="activate" class="btn primary" type="button">验证并激活</button><div class="contact-block"><p>还没有授权码？联系购买后，我们将为你签发永久或限期授权。</p><button id="contact" class="btn" type="button">联系作者 · 添加微信</button></div><div class="help">重装Windows或更换主板后机器码可能变化，需要联系作者重新签发。</div></main>
<dialog id="contact-dialog" aria-labelledby="contact-title"><div class="dialog-head"><h2 id="contact-title">联系购买与授权</h2><button id="contact-close" class="btn" type="button" aria-label="关闭联系窗口">×</button></div><img id="wechat-qr" class="qr" alt="微信联系二维码" hidden><div id="qr-missing">请通过下方微信号<br>搜索添加作者</div><p>联系人：<b id="contact-name"></b></p><div class="machine"><span id="contact-wechat" class="code"></span><button id="wechat-copy" type="button" class="btn">复制微信号</button></div><p>电话：<span id="contact-phone"></span><br>邮箱：<span id="contact-email"></span></p><section id="payment-section" hidden><h3>收款二维码</h3><img id="payment-qr" class="qr" alt="发布者收款二维码"></section><p class="note">添加微信后，请发送本机机器码及所需授权期限。付款经人工确认后领取授权码，返回此处粘贴激活。扫码付款不会自动激活。</p></dialog><script src="activation.js"></script></body></html>
